<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app">

        <sprites-component></sprites-component>
        
        <header-component></header-component>

        <page-banner
            photo="blog-top.jpg"
            title="Статьи & Новости"
            path="Блог"
            :st="true"
        ></page-banner>

        <div class="container">
            <div class="blog__last-post__block">
                <h1 class="title title__01">Последний пост</h1>

                <a href="post.html" class="blog__last-post">
                    <div class="blog__last-post__image">
                        <img :src="items.length > 0 ? 'images/blog/' + items[0].photo : ''" alt="">
                    </div>
                    <div class="blog__last-post__content">
                        <h1 class="title title__03 blog__last-post__title">
                            {{ items.length > 0 ? items[0].title : '' }}
                        </h1>
                        <h1 class="paragraph paragraph__large blog__last-post__paragraph">
                            {{ items.length > 0 ? items[0].text : '' }}
                        </h1>
                        <div class="blog__last-post__info">
                            <div class="blog__last-post__date">
                                {{ items.length > 0 ? items[0].date : '' }}
                            </div>

                            <div class="link__btn blog__link-btn">
                                <svg class="link__btn-icon">
                                    <use xlink:href="#link-arrow"></use>
                                </svg>
                            </div>
                        </div>
                    </div>
                </a>

            </div>
        </div>

        <div class="container">
            <div class="blog">
                <h1 class="title title__01 blog__title">
                    Статьи & Новости
                </h1>
                <div class="blog__items">

                    <blog-item 
                        v-for="item in items" 
                        
                        :title="item.title" 
                        :photo="item.photo" 
                        :date="item.date" 
                        :tag="tags[item.tag]" 
                    ></blog-item>

                </div>
            </div>
        </div>

        <footer-component></footer-component>

    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script src="components/HeaderComponent.js"></script>
    <script src="components/SpritesComponent.js"></script>
    <script src="components/PageBanner.js"></script>
    <script src="components/BlogItem.js"></script>
    <script src="components/FooterComponent.js"></script>

    <script>
        const { createApp, ref, onMounted } = Vue

        createApp({
            components: {
                HeaderComponent,
                SpritesComponent,
                PageBanner,
                BlogItem,
                FooterComponent
            },
            setup() {
                const items = ref([])
                const tags = ref({})

                const fetchItems = async () => {
                    try {
                        const response = await fetch('blog.json')
                        const data = await response.json()
                        items.value = data
                    } catch (error) {
                        console.error('Ошибка загрузки JSON:', error)
                    }
                }

                const fetchTags = async () => {
                    try {
                        const response = await fetch('blog-tags.json')
                        const data = await response.json()
                        tags.value = data
                    } catch (error) {
                        console.error('Ошибка загрузки JSON:', error)
                    }
                }

                onMounted(() => {
                    fetchItems()
                    fetchTags()
                })

                return {
                    items,
                    tags
                }
            }
        }).mount('#app')
    </script>

</body>

</html>
